# Pre-commit hooks (SPEC §7.1). They run the same gates as scripts/check.ps1 -Fast,
# inside the dev container, so the host needs nothing but Docker.
#
# Not installed by default: pre-commit itself is a host tool. To enable it,
# install pre-commit on the host and run `pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: stratal-format
        name: ruff format --check
        entry: docker compose run --rm --no-deps dev ruff format --check .
        language: system
        pass_filenames: false
      - id: stratal-lint
        name: ruff check
        entry: docker compose run --rm --no-deps dev ruff check .
        language: system
        pass_filenames: false
      - id: stratal-types
        name: pyright (strict)
        entry: docker compose run --rm --no-deps dev pyright
        language: system
        pass_filenames: false
        types: [python]
