[project]
name = "stratal"
version = "0.1.0"
description = "Local, end-to-end ML lifecycle platform for consumer hardware"
requires-python = ">=3.12,<3.13"
# Every dependency names the requirement that needs it (SPEC §9.1).
dependencies = [
    "alembic>=1.13",            # SPEC §7.2 STORE: migrations (ADR-0002)
    "celery[redis]>=5.4",       # SPEC §7.7 job queue; RUN-1.1 slice (ADR-0003)
    "fastapi>=0.115",           # SPEC §7.3 API
    "nvidia-ml-py>=12.560",     # MON-2.1 GPU utilization, VRAM, temperature, power (NVML)
    "psutil>=6.0",              # MON-2.1 CPU, RAM, disk I/O, process RSS
    "pillow>=11.0",             # DATA-1.1 image format and dimensions; DATA-1.2 corrupt detection
    "pyarrow>=18.0",            # DATA-3.1 Parquet manifests
    "psycopg[binary]>=3.2",     # SPEC §7.2 STORE: PostgreSQL driver (ADR-0002)
    "pydantic>=2.9",            # SPEC §7.1 Config
    "pydantic-settings>=2.5",   # SPEC §7.1 Config from environment
    "redis>=5.1",               # SPEC §7.2 STORE: broker, event stream, flags
    "sqlalchemy>=2.0.36",       # SPEC §7.2 STORE (ADR-0002)
    "structlog>=24.4",          # NFR-10 structured JSON logs
    "uvicorn>=0.30",            # SPEC §7.3 API server
]

[project.optional-dependencies]
# Installed only in the GPU worker image. The API image stays free of ML libraries.
gpu = [
    "torch>=2.5",               # LABEL-1.1, RUN-1.4; spikes S-01 and S-02
    "transformers>=4.56",       # LABEL-1.1 Florence-2 (native class, ADR-0009), LABEL-1.3 CLIP
]

[dependency-groups]
# Also installed in the GPU worker image, so GPU-marked tests can run there.
test = [
    "pytest>=8.3",              # SPEC §7.1 Tests
]
dev = [
    { include-group = "test" },
    "httpx2>=2.16",             # FastAPI's TestClient needs it (httpx is deprecated there)
    "pyright[nodejs]>=1.1.380", # SPEC §7.1 Quality: strict type checking
    "ruff>=0.7",                # SPEC §7.1 Quality: lint and format
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stratal"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# The spec's own wording uses en dashes and arrows ("image–caption", "→"); they are intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations carry long constraint strings that are clearer left whole.
"migrations/versions/*" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not gpu'"
markers = [
    "integration: needs real postgres and redis (run inside Compose)",
    "gpu: needs the GPU; run locally in the worker-gpu image",
]
