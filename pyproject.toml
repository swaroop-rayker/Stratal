[project]
name = "stratal"
version = "0.1.0"
description = "Local, end-to-end ML lifecycle platform for consumer hardware"
requires-python = ">=3.12,<3.13"
# Every dependency names the requirement that needs it (SPEC §9.1).
dependencies = [
    "alembic>=1.13",            # SPEC §7.2 STORE: migrations (ADR-0002)
    "celery[redis]>=5.4",       # SPEC §7.7 job queue; RUN-1.1 slice (ADR-0003)
    "fastapi>=0.115",           # SPEC §7.3 API
    "nvidia-ml-py>=12.560",     # MON-2.1 GPU utilization, VRAM, temperature, power (NVML)
    "psutil>=6.0",              # MON-2.1 CPU, RAM, disk I/O, process RSS
    "pillow>=11.0",             # DATA-1.1 image format and dimensions; DATA-1.2 corrupt detection
    "pyarrow>=18.0",            # DATA-3.1 Parquet manifests
    "psycopg[binary]>=3.2",     # SPEC §7.2 STORE: PostgreSQL driver (ADR-0002)
    "pydantic>=2.9",            # SPEC §7.1 Config
    "pydantic-settings>=2.5",   # SPEC §7.1 Config from environment
    "redis>=5.1",               # SPEC §7.2 STORE: broker, event stream, flags
    "sqlalchemy>=2.0.36",       # SPEC §7.2 STORE (ADR-0002)
    "structlog>=24.4",          # NFR-10 structured JSON logs
    "uvicorn>=0.30",            # SPEC §7.3 API server
]

[project.optional-dependencies]
# Installed only in the GPU worker image. The API image stays free of ML libraries.
gpu = [
    "torch>=2.5",               # LABEL-1.1, RUN-1.4; spikes S-01 and S-02
    "transformers>=4.56",       # LABEL-1.1 Florence-2 (native class, ADR-0009), LABEL-1.3 CLIP
    "numpy>=2.0",               # RUN-1.1 image decoding for training (stratal.train.data)
    "safetensors>=0.4",         # RUN-1.3 checkpoints and NFR-8 weights, never pickled
    "scikit-learn>=1.9",        # ML-1.1-1.5 pipelines; EVAL-1.2 sklearn.metrics (K2); serving, ADR-0019 rule 20
    "skops>=0.16",              # ML-1.5 safe persistence of scikit-learn models (NFR-8)
    "optuna>=5.0",              # HPO-1.2 TPE and the median pruner (ADR-0018)
    "sacrebleu>=2.6",           # EVAL-1.2 BLEU and chrF (K2)
]
# Installed only in the CPU worker image (ADR-0014 rule 11): CPU training, RUN-1.9.
# PyTorch's CPU-only build, from its own index; it conflicts with the CUDA build above.
ml-cpu = [
    "torch>=2.5",               # RUN-1.9 CPU training; RUN-1.1 device cpu
    "numpy>=2.0",               # RUN-1.1 image decoding for training (stratal.train.data)
    "safetensors>=0.4",         # RUN-1.3 checkpoints and NFR-8 weights, never pickled
    "scikit-learn>=1.9",        # ML-1.1-1.5 pipelines; EVAL-1.2 sklearn.metrics (K2); serving, ADR-0019 rule 20
    "skops>=0.16",              # ML-1.5 safe persistence of scikit-learn models (NFR-8)
    "optuna>=5.0",              # HPO-1.2 TPE and the median pruner (ADR-0018)
    "sacrebleu>=2.6",           # EVAL-1.2 BLEU and chrF (K2)
]

[dependency-groups]
# Also installed in the GPU worker image, so GPU-marked tests can run there.
test = [
    "pytest>=8.3",              # SPEC §7.1 Tests
    "torchinfo>=1.8",           # BUILD-1.5: cross-checks the builder's parameter counts (tests only)
]
dev = [
    { include-group = "test" },
    "httpx2>=2.16",             # FastAPI's TestClient needs it (httpx is deprecated there)
    "pyright[nodejs]>=1.1.380", # SPEC §7.1 Quality: strict type checking
    "ruff>=0.7",                # SPEC §7.1 Quality: lint and format
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stratal"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# The spec's own wording uses en dashes and arrows ("image–caption", "→"); they are intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations carry long constraint strings that are clearer left whole.
"migrations/versions/*" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not gpu and not acceptance'"
markers = [
    "integration: needs real postgres and redis (run inside Compose)",
    "gpu: needs the GPU; run locally in the worker-gpu image",
    "torch: needs PyTorch; runs in the worker-gpu image (check.ps1, step 'integration (torch)')",
    "ml: needs scikit-learn, skops, Optuna or sacrebleu; runs in the worker-cpu image (check.ps1, step 'ml')",
    "benchmark: timing measurement; needs a quiet machine (check.ps1 -Bench)",
    "acceptance: a full run on the live stack, over an hour (tests/acceptance)",
]

[tool.uv]
# The CUDA and CPU builds of PyTorch cannot be installed together (ADR-0014 rule 11).
conflicts = [[{ extra = "gpu" }, { extra = "ml-cpu" }]]
# M10's new packages are held to releases at least two weeks old when they were locked
# (the owner's choice, 2026-11-19). cloudpickle comes with joblib (scikit-learn); nothing
# in Stratal calls it (NFR-8). Lift these when re-locking deliberately.
constraint-dependencies = [
    "optuna<5.1",
    "cloudpickle<3.1.3",
    "narwhals<2.29",
    "prettytable<3.19",
    "threadpoolctl<3.8",
]

[tool.uv.sources]
# The GPU extra takes PyTorch from PyPI (the CUDA build); ml-cpu from PyTorch's CPU index.
torch = [{ index = "pytorch-cpu", extra = "ml-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
