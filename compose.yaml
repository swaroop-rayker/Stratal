# Stratal development stack.
#
#   docker compose up -d                      postgres, redis, api, worker-cpu, monitor
#   docker compose --profile gpu up -d        the same plus the GPU worker and inference
#   docker compose run --rm dev <command>     lint, type-check, tests
#   docker compose run --rm worker-gpu <cmd>  anything that needs the GPU
#
# Memory limits implement NFR-2 (ADR-0007): everything together stays under 9 GB.

name: stratal

x-stratal-env: &stratal-env
  STRATAL_DATABASE_URL: postgresql+psycopg://stratal:stratal@postgres:5432/stratal
  STRATAL_REDIS_URL: redis://redis:6379/0
  STRATAL_DATA_DIR: /data
  # NFR-7: jobs never reach the model hub. Models come only from
  # 'python -m stratal.cli models pull', which does not use these libraries.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

# The api, monitor and beat services run the same image (worker-cpu adds PyTorch CPU).
x-stratal-build: &stratal-build
  context: .
  dockerfile: docker/Dockerfile
  target: api

# Source folders for ingestion, read-only. Set STRATAL_SOURCES_DIR to a Windows folder,
# or put data under .\sources. Jobs refer to it as /sources/<name>.
x-sources: &sources "${STRATAL_SOURCES_DIR:-./sources}:/sources:ro"

services:
  postgres:
    image: postgres:17
    environment:
      # Local-only development credentials. Nothing is published outside the Compose network.
      POSTGRES_USER: stratal
      POSTGRES_PASSWORD: stratal
      POSTGRES_DB: stratal
    volumes:
      - stratal-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratal -d stratal"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - stratal-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  api:
    build: *stratal-build
    image: stratal-api
    environment:
      <<: *stratal-env
    volumes:
      - stratal-data:/data
      - *sources
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 400m
    restart: unless-stopped

  # CPU stages: ingest now; clean, preprocess, filter, split and evaluate later.
  # Each task is a supervisor that runs the stage in a child process (ADR-0003).
  worker-cpu:
    # Its own image: the api image plus PyTorch's CPU build (ml-cpu extra, ADR-0014 rule 11),
    # for training runs on the CPU (RUN-1.9). api, monitor and beat stay without ML libraries.
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker-cpu
    image: stratal-worker-cpu
    command: ["celery", "-A", "stratal.runtime.celery_app", "worker", "-Q", "cpu", "-c", "2", "-n", "cpu@%h"]
    environment:
      <<: *stratal-env
    volumes:
      - stratal-data:/data
      - *sources
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 2500m
    restart: unless-stopped

  # Scheduled maintenance (NFR-12): a worker on its own queue with the Celery Beat
  # scheduler embedded, so telemetry downsampling never waits behind a pipeline stage.
  beat:
    build: *stratal-build
    image: stratal-api
    command: ["celery", "-A", "stratal.runtime.celery_app", "worker", "-Q", "maintenance", "-P", "solo", "-B", "-n", "beat@%h"]
    environment:
      <<: *stratal-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 200m
    restart: unless-stopped

  # Collector, sampler and watchdog in one process (ADR-0005). It needs the GPU
  # only to read NVML; it never runs CUDA.
  monitor:
    build: *stratal-build
    image: stratal-api
    command: ["python", "-m", "stratal.mon"]
    environment:
      <<: *stratal-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, utility]
    mem_limit: 256m
    restart: unless-stopped

  # The web UI's dev server (SPEC §7.4, UI-2.1): Vite on 127.0.0.1:5173, /api proxied to
  # the api service. 'docker compose run --rm --no-deps frontend npm run <script>' runs the
  # frontend's checks with the frontend-tools service below.
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: stratal-frontend
    environment:
      STRATAL_API_URL: http://api:8000
    volumes:
      - ./frontend:/app/frontend
      - ./assets:/app/assets:ro
      - stratal-node-modules:/app/frontend/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    mem_limit: 400m
    restart: unless-stopped

  # The frontend's checks need more heap than the dev server: run on demand only, like
  # 'dev'. docker compose run --rm frontend-tools npm run typecheck (lint, test, build)
  frontend-tools:
    profiles: ["dev"]
    image: stratal-frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      STRATAL_API_URL: http://api:8000
      NODE_OPTIONS: --max-old-space-size=1200
    volumes:
      - ./frontend:/app/frontend
      - ./assets:/app/assets:ro
      - stratal-node-modules:/app/frontend/node_modules
    command: ["npm", "run", "typecheck"]
    mem_limit: 1536m

  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    environment:
      <<: *stratal-env
    volumes:
      - .:/app
      - stratal-data:/data
      - *sources
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 2500m

  worker-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker-gpu
    # GPU stages, one at a time. 'docker compose run --rm worker-gpu python <script>'
    # still replaces this command for one-off GPU work.
    command: ["celery", "-A", "stratal.runtime.celery_app", "worker", "-Q", "gpu", "-c", "1", "-n", "gpu@%h"]
    environment:
      <<: *stratal-env
    volumes:
      - ./scripts:/app/scripts:ro
      # For GPU-marked tests: docker compose run --rm --no-deps worker-gpu pytest -m gpu tests/gpu
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - *sources
      - stratal-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 3500m  # 1 GB went to inference (ADR-0016 rule 7); peak measured 1.6 GB training, 2.2 GB labelling

  inference:
    # REG-1.4, ADR-0016: holds at most one model and serves the API's /predict. The
    # worker-gpu image, for PyTorch with CUDA (also used on the CPU). Reachable only on
    # the Compose network. It exits when an unload leaves VRAM behind; Compose restarts it.
    profiles: ["gpu"]
    image: stratal-worker-gpu
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker-gpu
    command: ["python", "-m", "stratal.inference"]
    environment:
      <<: *stratal-env
    volumes:
      - stratal-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 1000m
    restart: unless-stopped

volumes:
  stratal-pg:
  stratal-redis:
  stratal-data:
  stratal-node-modules:
